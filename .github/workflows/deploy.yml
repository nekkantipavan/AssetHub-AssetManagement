name: Deploy to Production (192.168.24.15)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to IIS Production Server
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy Production Environment Configuration
        run: |
          if (Test-Path "D:\asset-management\server\.env") {
            Copy-Item "D:\asset-management\server\.env" -Destination "server\.env" -Force
            Write-Host "✓ Copied production .env file"
          } else {
            Write-Host "⚠ No production .env found at D:\asset-management\server\.env"
          }

      - name: Install Dependencies
        run: |
          npm install
          cd server
          npm install

      - name: Run Database Migrations
        run: |
          cd server
          node -e "
            const fs = require('fs');
            if (fs.existsSync('./.env')) { require('dotenv').config(); }
            const pool = require('./db');
            const sql = fs.readFileSync('./migrations/010_create_challan_documents.sql', 'utf8');
            pool.query(sql)
              .then(() => { console.log('✓ Migration 010 complete'); process.exit(0); })
              .catch(e => { console.log('Migration note:', e.message); process.exit(0); });
          "

      - name: Build Frontend Production Assets
        run: |
          npm run build

      - name: Deploy Compiled Assets & Server Code to IIS Directory
        run: |
          Write-Host "Deploying to D:\asset-management..."

          if (!(Test-Path "D:\asset-management\dist")) { New-Item -Path "D:\asset-management\dist" -ItemType Directory -Force }
          if (!(Test-Path "D:\asset-management\server")) { New-Item -Path "D:\asset-management\server" -ItemType Directory -Force }

          # 1. Copy Frontend Build files
          Copy-Item -Path "dist\*" -Destination "D:\asset-management\dist" -Recurse -Force
          Write-Host "✓ Frontend dist deployed to D:\asset-management\dist"

          # 2. Copy Server files (excluding node_modules and uploads to protect uploaded files)
          Get-ChildItem -Path "server" -Exclude "node_modules","uploads" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "D:\asset-management\server" -Recurse -Force
          }
          Write-Host "✓ Server code deployed to D:\asset-management\server"

      - name: Restart IIS Web Services
        run: |
          Import-Module WebAdministration
          Get-ChildItem IIS:\AppPools | ForEach-Object { Restart-WebAppPool $_.name }
          Write-Host "✓ IIS Application Pools restarted successfully."
