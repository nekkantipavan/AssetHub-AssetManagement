name: Deploy to Production (192.168.24.15)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to IIS Production Server
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Migrations
        run: |
          cd server
          npm install --production=false
          node -e "const pool = require('./db'); const fs = require('fs'); const sql = fs.readFileSync('./migrations/010_create_challan_documents.sql', 'utf8'); pool.query(sql).then(() => { console.log('✓ Migration 010 complete'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); });"

      - name: Build Frontend Production Assets
        run: |
          npm install
          npm run build

      - name: Deploy Compiled Assets & Server Code to IIS Directory
        powershell: |
          Write-Host "Deploying to D:\asset-management..."
          
          # Ensure target folders exist
          if (!(Test-Path "D:\asset-management\dist")) { New-Item -Path "D:\asset-management\dist" -ItemType Directory -Force }
          if (!(Test-Path "D:\asset-management\server")) { New-Item -Path "D:\asset-management\server" -ItemType Directory -Force }
          if (!(Test-Path "D:\asset-management\server\uploads")) { New-Item -Path "D:\asset-management\server\uploads" -ItemType Directory -Force }

          # 1. Copy Frontend Build files to D:\asset-management\dist
          Copy-Item -Path "dist\*" -Destination "D:\asset-management\dist" -Recurse -Force
          Write-Host "✓ Frontend dist deployed to D:\asset-management\dist"

          # 2. Copy Server files to D:\asset-management\server (excluding node_modules and uploads to prevent overwriting user files)
          Get-ChildItem -Path "server" -Exclude "node_modules","uploads" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "D:\asset-management\server" -Recurse -Force
          }
          Write-Host "✓ Server code deployed to D:\asset-management\server"

      - name: Restart IIS Web Services
        powershell: |
          Import-Module WebAdministration
          Get-ChildItem IIS:\AppPools | ForEach-Object { Restart-WebAppPool $_.name }
          Write-Host "✓ IIS Application Pools restarted successfully."
