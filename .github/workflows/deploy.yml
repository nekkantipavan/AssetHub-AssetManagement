name: Deploy to Production (192.168.24.15)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to IIS Production Server
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy Production Environment Configuration
        run: |
          if (Test-Path "D:\asset-management\server\.env") {
              Copy-Item "D:\asset-management\server\.env" -Destination "server\.env" -Force
              Write-Host "[OK] Copied production .env file"
          } else {
              Write-Host "[WARN] No production .env found at D:\asset-management\server\.env"
          }

      - name: Install Dependencies
        run: |
          npm install
          Set-Location server
          npm install

      - name: Run Database Migrations
        run: |
          Set-Location server
          node -e "const fs = require('fs'); if (fs.existsSync('./.env')) { require('dotenv').config(); } const pool = require('./db'); const sql = fs.readFileSync('./migrations/010_create_challan_documents.sql', 'utf8'); pool.query(sql).then(() => { console.log('[OK] Migration 010 complete'); process.exit(0); }).catch(e => { console.log('Migration status:', e.message); process.exit(0); });"

      - name: Build Frontend Production Assets
        run: |
          npm run build

      - name: Deploy Compiled Assets & Server Code to IIS Directory
        run: |
          Write-Host "Deploying to D:\asset-management..."

          if (-not (Test-Path "D:\asset-management\dist")) { New-Item -Path "D:\asset-management\dist" -ItemType Directory -Force }
          if (-not (Test-Path "D:\asset-management\server")) { New-Item -Path "D:\asset-management\server" -ItemType Directory -Force }

          Copy-Item -Path "dist\*" -Destination "D:\asset-management\dist" -Recurse -Force
          Write-Host "[OK] Frontend dist deployed to D:\asset-management\dist"

          Get-ChildItem -Path "server" -Exclude "node_modules","uploads" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "D:\asset-management\server" -Recurse -Force
          }
          Write-Host "[OK] Server code deployed to D:\asset-management\server"

      - name: Refresh IIS Services
        run: |
          try {
              Import-Module WebAdministration -ErrorAction SilentlyContinue
              Get-ChildItem IIS:\AppPools -ErrorAction SilentlyContinue | ForEach-Object { Restart-WebAppPool $_.name -ErrorAction SilentlyContinue }
              Write-Host "[OK] IIS Application Pools restarted successfully."
          } catch {
              Write-Host "[NOTE] IIS AppPool restart skipped (insufficient permissions for config read)."
          }

      - name: Restart Backend Service (PM2)
        run: |
          try {
              pm2 restart all
              Write-Host "[OK] PM2 backend service restarted successfully."
          } catch {
              Write-Host "[NOTE] PM2 restart command skipped."
          }
